name: jarvis_plus
description: Offline On-Device AI Chatbot for Android with Zero Server Cost
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local AI Inference via llama.cpp
  llama_cpp_dart: ^0.0.9
  ffi: ^2.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Zero-cost Download Manager with Resume Support
  dio: ^5.4.3+1
  permission_handler: ^11.3.1

  # Fast Local Storage (No backend required)
  shared_preferences: ^2.2.3

  # State Management & UI Utilities
  flutter_riverpod: ^2.5.1
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/prompts/
